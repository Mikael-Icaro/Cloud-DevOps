# Modelo de referencia. Nao commitar o Secret real -- gerar em cluster com:
#   kubectl create secret generic loja-veloz-secrets \
#     --namespace loja-veloz \
#     --from-literal=POSTGRES_PASSWORD='troque_essa_senha' \
#     --from-literal=DATABASE_URL='postgresql://loja:troque_essa_senha@postgres:5432/loja_veloz'
# ou via um cofre externo (Vault, Sealed Secrets, SOPS) em producao.
apiVersion: v1
kind: Secret
metadata:
  name: loja-veloz-secrets
  namespace: loja-veloz
type: Opaque
stringData:
  POSTGRES_PASSWORD: "troque_essa_senha"
  DATABASE_URL: "postgresql://loja:troque_essa_senha@postgres:5432/loja_veloz"
